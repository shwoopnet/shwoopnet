# DRAFT, NOT ACTIVE (lives in workers/drafts, copy to .github/workflows only after the owner approves the minutes). DERIBIT1 pilot: one 7.5 minute window a day before the 20:00 UTC Kalshi BTC hourly close.
# Public keyless GETs only (Deribit public API, Kalshi public API). No secret, no order. The built-in GITHUB_TOKEN pushes gzipped CSVs to the `deribit-data` branch ONLY, never main.
# Stop date: the job exits at once after 2026-12-14 (28 daily runs, about 9 billed minutes each, about 252 minutes).
name: record-deribit
on:
  schedule:
    - cron: "52 19 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: record-deribit
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: ${{ github.event_name == 'workflow_dispatch' || github.run_started_at < '2026-12-14' }}
    steps:
      - name: Get the recorder script from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          path: code
      - name: Open the data branch (created empty the first time)
        run: |
          mkdir data && cd data
          git init -q
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin deribit-data; then git checkout -q -b deribit-data FETCH_HEAD; else git checkout -q --orphan deribit-data; fi
      - name: Record 450 seconds, one poll every 5 seconds
        run: |
          STAMP="$(date -u +%Y-%m-%d)"
          mkdir -p "data/deribit/$STAMP"
          python3 code/scripts/record_deribit.py "data/deribit/$STAMP" --duration 450 --step 5
          gzip -9 -f data/deribit/$STAMP/*.csv
      - name: Commit and push the data branch
        if: always()
        run: |
          cd data
          git config user.name "deribit-recorder"
          git config user.email "deribit-recorder@users.noreply.github.com"
          git add deribit
          git commit -q -m "deribit $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "nothing new"; exit 0; }
          for i in 1 2 3; do git push -q origin deribit-data && exit 0; git pull -q --rebase origin deribit-data || true; done
          exit 1
