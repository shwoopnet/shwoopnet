# Nov 4, 2026 (research only, RECBUILD1; the owner approved collector 1): records Kalshi's NHL goal, assist and points ladders (KXNHLGOAL, KXNHLAST, KXNHLPTS), every rung with bid, ask, sizes, volume, open interest and the server Date header, at 120, 90, 60, 30 and 5 minutes before each game's ESPN start time, plus ESPN's schedule row and, after the game, the box score goals and assists. Why: the NHLAUDIT1 volume-universe problem (a rung entered the history only if its lifetime volume, in-game trading included, was above 0), so the forward read needs the ladder and its volume AT the look.
# Public data only: no key, no secret, no order. The built-in GITHUB_TOKEN pushes gzipped files to the `quote-data` branch (under nhl/), never to main. Nothing runs after 2027-02-01 06:00 UTC (checked in the first step and again in the script); delete this workflow to stop sooner.
# Three starts a day, chosen from typical NHL start times (all times UTC; the season runs on Eastern standard time, EST = UTC - 5):
#   14:45  = 09:45 ET. Weekend and holiday matinees start 12:00 to 17:00 ET, so their first looks (120 minutes before) fall from 10:00 ET. On a weekday with no early game this job finds no look due before the next start and ends within a couple of minutes.
#   21:30  = 16:30 ET. The 7:00 to 7:30 pm ET slate (the bulk of every night) starts 00:00 to 00:30 UTC, so its 120 minute looks are at 22:00 UTC; this job also covers the 8:00 and 9:00 pm ET (Central) starts, up to the next start.
#   01:30  = 20:30 ET. The 10:00 to 10:30 pm ET (7:00 to 7:30 pm Pacific) games start 03:00 to 03:30 UTC and their last look (5 minutes before) is at about 03:25 UTC; the job ends when no look is left.
# A job runs until a few minutes past the next start time at least an hour away and ends sooner when no look is due before then, so idle waiting is not billed. GitHub often starts a scheduled run late: the earliest look of a game is the one that is lost (and counted as missed in nhl/runs/<date>.csv), never invented.
# Requests: at most 1 a second to each of Kalshi and ESPN; Kalshi bulk reads of the three series (1 to 5 pages each) only when a look is due.
name: record-nhl
on:
  schedule:
    - cron: "45 14 * * *"
    - cron: "30 21 * * *"
    - cron: "30 1 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: record-nhl
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Stop for good after the end date (2027-02-01 06:00 UTC)
        id: gate
        run: |
          if [ "$(date -u +%s)" -ge "$(date -u -d '2027-02-01T06:00:00Z' +%s)" ]; then echo "past the end date: nothing to record"; echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - name: Get the recorder script from main
        if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          path: code
      - name: Open the data branch (created empty the first time)
        if: steps.gate.outputs.go == 'true'
        run: |
          mkdir data && cd data
          git init -q
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin quote-data; then git checkout -q -b quote-data FETCH_HEAD; else git checkout -q --orphan quote-data; fi
      - name: Record until a few minutes past the next start time (or until no look is left)
        if: steps.gate.outputs.go == 'true'
        run: python3 code/scripts/record_nhl.py data/nhl --anchors 14:45,21:30,01:30
      - name: Commit and push the data branch
        if: always() && steps.gate.outputs.go == 'true'
        run: |
          cd data
          git config user.name "nhl-recorder"
          git config user.email "nhl-recorder@users.noreply.github.com"
          git add nhl
          git commit -q -m "nhl $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "nothing new"; exit 0; }
          for i in 1 2 3 4 5 6; do git push -q origin quote-data && exit 0; [ "$i" -lt 6 ] || break; sleep $((2 ** i)); git pull -q --rebase origin quote-data || true; done  # up to 6 tries, waits 2,4,8,16,32 s: a GitHub 500 needs more than a second
          exit 1
