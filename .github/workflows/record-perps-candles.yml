# Saves Kalshi's PUBLIC 1 minute candles and funding history for the stock and index perps, one finished UTC date a night (research only, Nov 6, 2026, V2's request, the owner approved).
# No secret is used or needed: plain GETs of public endpoints; the built-in GITHUB_TOKEN only pushes gzipped CSV to the `perp-data` branch (under kalshi1m/ and funding/), never to main.
# Three starts a night, Sunday night to Friday night UTC (Monday to Saturday 02:00 to 04:00), each archives the previous UTC date; the script does nothing if that date's files exist. Stops by itself after 2027-02-26.
name: record-perps-candles
on:
  schedule:
    - cron: "0 2,3,4 * * 1-6"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: record-perps-candles
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get the recorder scripts from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          path: code
      - name: Open the data branch
        run: |
          mkdir data && cd data
          git init -q
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin perp-data; then git checkout -q -b perp-data FETCH_HEAD; else git checkout -q --orphan perp-data; fi
      - name: Record
        run: |
          [ "$(date -u +%Y%m%d)" -le 20270226 ] || { echo "past the stop date 2027-02-26; nothing recorded"; exit 0; }
          python3 code/scripts/record_perps_candles.py data
      - name: Commit and push the data branch
        run: |
          cd data
          git config user.name "perp-recorder"
          git config user.email "perp-recorder@users.noreply.github.com"
          git add kalshi1m funding 2>/dev/null || true
          git commit -q -m "perps candles $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "nothing new"; exit 0; }
          for i in 1 2 3 4 5 6; do git push -q origin perp-data && exit 0; [ "$i" -lt 6 ] || break; sleep $((2 ** i)); git pull -q --rebase origin perp-data || true; done
          exit 1
