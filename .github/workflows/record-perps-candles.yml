# Saves Kalshi's PUBLIC 1 minute candles and funding history for EVERY perp on the public list (all classes since Nov 16, 2026; stock and index perps first), one finished UTC date a night (research only, Nov 6, 2026, V2's request, the owner approved).
# No secret is used or needed: plain GETs of public endpoints; the built-in GITHUB_TOKEN only pushes gzipped CSV to the `perp-data` branch (under kalshi1m/ and funding/), never to main.
# Three starts a night, every night UTC (02:00 to 04:00, every day since Nov 15, 2026 so Saturday is archived), each archives the previous UTC date; the script does nothing if that date's files exist. Stops by itself after 2027-02-26.
name: record-perps-candles
on:
  schedule:
    - cron: "0 2,3,4 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Back-pull: one finished UTC date (YYYY-MM-DD); leave empty for the normal run"
        required: false
        type: string
      only:
        description: "Back-pull: comma separated tickers, e.g. KXGOLDPERP,KXUS500PERP, the word NEW for every perp not archived before Nov 16, FUNDING_DAY for every market funding prints of that date in one request, or FUNDING_ALL for the whole funding history (needs a date)"
        required: false
        type: string
      days:
        description: "Back-pull: how many dates to archive, counting back from the date (1 to 90, default 1)"
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: record-perps-candles
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Get the recorder scripts from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          path: code
      - name: Open the data branch
        run: |
          mkdir data && cd data
          git init -q
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin perp-data; then git checkout -q -b perp-data FETCH_HEAD; else git checkout -q --orphan perp-data; fi
      - name: Record
        env:
          BACK_DATE: ${{ inputs.date }}
          BACK_ONLY: ${{ inputs.only }}
          BACK_DAYS: ${{ inputs.days }}
        run: |
          [ "$(date -u +%Y%m%d)" -le 20270226 ] || { echo "past the stop date 2027-02-26; nothing recorded"; exit 0; }
          if [ -n "$BACK_DATE" ]; then
            [[ "$BACK_DATE" =~ ^20[0-9]{2}-[01][0-9]-[0-3][0-9]$ ]] || { echo "bad date"; exit 1; }
            [[ -z "$BACK_ONLY" || "$BACK_ONLY" =~ ^[A-Z0-9_,]{1,200}$ ]] || { echo "bad ticker list"; exit 1; }
            N="${BACK_DAYS:-1}"
            [[ "$N" =~ ^[0-9]{1,2}$ ]] && [ "$N" -ge 1 ] && [ "$N" -le 90 ] || { echo "bad days"; exit 1; }
            for i in $(seq 0 $((N - 1))); do
              D="$(date -u -d "$BACK_DATE - $i days" +%Y-%m-%d)"
              echo "back-pull $D"
              python3 code/scripts/record_perps_candles.py data "$D" "$BACK_ONLY" || echo "date $D did not finish; the next date is still tried"
            done
          else
            python3 code/scripts/record_perps_candles.py data
          fi
      - name: Commit and push the data branch
        run: |
          cd data
          git config user.name "perp-recorder"
          git config user.email "perp-recorder@users.noreply.github.com"
          git add kalshi1m funding 2>/dev/null || true
          git commit -q -m "perps candles $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "nothing new"; exit 0; }
          for i in 1 2 3 4 5 6; do git push -q origin perp-data && exit 0; [ "$i" -lt 6 ] || break; sleep $((2 ** i)); git pull -q --rebase origin perp-data || true; done
          exit 1
