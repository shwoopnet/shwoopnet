# Nov 11, 2026 (the owner approved). Politics shadow recorder: every 30 minutes the quote of every open market of the series in kalshi-scalper/workers/POLREC_SERIES.json that settles within
# 14 days (the owner's hold cap), plus an hourly read of results, plus a daily count of what the cap left out. Research data only: public Kalshi market data, no key, no secret, no order, no Firestore.
# The built-in GITHUB_TOKEN pushes gzipped files to its OWN `pol-data` branch (under polrec/), never to main; `quote-data` is already large and every job fetches its whole branch. The first run creates `pol-data` as an orphan branch.
# GitHub dropped most hourly starts (3 successful runs in 19 hours), so a start now comes every 15 minutes (minutes 7, 22, 37, 52) and each run does ONE poll, about 4 minutes, then ends.
# A freshness step skips a poll when the newest polrec folder on the data branch is under 25 minutes old, so a full set of starts still gives about one poll per 30 minutes (at most 48 a day) and a dropped start is covered by the next one.
# Per poll: about 45 requests (42 series, a few pages), 5 seconds apart, so never more than 12 a minute; the hourly results read (first run of each hour, started before minute 20) adds about 45 more. About 2 requests a minute on average at most, no more than before.
# About 400 runner minutes a day (polls, results reads, and the short skipped runs), free on a public repo. Folder names carry the run id and attempt, so two runs can never write the same file.
# One concurrency group that never cancels: a run that finds a job running waits, so jobs never overlap.
# Self-chaining (Nov 12, 2026): GitHub dropped most scheduled starts (3 pushed runs since Nov 11 against 48 a day intended). After the poll and the push, a final step (if: always(), so a failed poll still chains)
# sleeps to the next :00 or :30 UTC that is at least 20 minutes after this run started, then re-dispatches this same workflow on main with the built-in token (a workflow_dispatch started by GITHUB_TOKEN does create a run, the documented exception).
# A run skipped by the freshness step, or past the end date, does NOT chain: another chain or a cron start already exists. The cron stays as the restart path if the chain ever dies. Needs `actions: write` for the dispatch; nothing else was widened.
# Runner minutes: about 48 chained runs a day, each up to ~50 billed minutes (poll ~4 plus a sleep to the next half hour), so ~2,000 a day, a chain keeps one runner busy. Free on a public repo, but far over the Charter's 250 a month guideline: flagged for the owner.
# It stops by itself: from 2027-02-28 23:59 UTC every run exits at once (checked in the first step and again in the script). Stop it sooner by deleting this file.
name: record-politics
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
concurrency:
  group: record-politics
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Stop for good after the end date (2027-02-28 23:59 UTC)
        id: gate
        run: |
          echo "start=$(date -u +%s)" >> "$GITHUB_OUTPUT"   # the run's own start time (github.run_started_at is not a context value, which made every chain die at link one)
          if [ "$(date -u +%s)" -ge "$(date -u -d '2027-02-28T23:59:00Z' +%s)" ]; then echo "past the end date: nothing to record"; echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - name: Get the recorder script from main
        if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          path: code
      - name: Open the data branch (created empty the first time)
        if: steps.gate.outputs.go == 'true'
        run: |
          mkdir data && cd data
          git init -q
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin pol-data; then git checkout -q -b pol-data FETCH_HEAD; else git checkout -q --orphan pol-data; fi
      - name: Skip when a poll is under 25 minutes old (a start the schedule did not drop)
        id: fresh
        if: steps.gate.outputs.go == 'true'
        run: |
          LAST="$(ls -d data/polrec/*/* 2>/dev/null | sort | tail -1)"
          if [ -n "$LAST" ]; then
            D="$(basename "$(dirname "$LAST")")"; T="$(basename "$LAST" | cut -c1-4)"
            THEN="$(date -u -d "$D ${T:0:2}:${T:2:2}" +%s 2>/dev/null || echo 0)"
            if [ $(( $(date -u +%s) - THEN )) -lt 1500 ]; then echo "last poll $LAST is under 25 minutes old: skipping"; echo "poll=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          fi
          echo "poll=true" >> "$GITHUB_OUTPUT"
      - name: Poll once
        if: steps.gate.outputs.go == 'true' && steps.fresh.outputs.poll == 'true'
        run: |
          STAMP="$(date -u +%Y-%m-%d/%H%M)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "data/polrec/$STAMP"
          python3 code/scripts/record_politics.py "data/polrec/$STAMP" --minutes 0
          gzip -9 -f data/polrec/$STAMP/*.csv
      - name: Commit and push the data branch
        if: always() && steps.gate.outputs.go == 'true'
        run: |
          cd data
          git config user.name "polrec-recorder"
          git config user.email "polrec-recorder@users.noreply.github.com"
          gzip -9 -f polrec/*/*/*.csv 2>/dev/null || true
          git add polrec
          git commit -q -m "polrec $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "nothing new"; exit 0; }
          for i in 1 2 3 4 5 6; do git push -q origin pol-data && exit 0; [ "$i" -lt 6 ] || break; sleep $((2 ** i)); git pull -q --rebase origin pol-data || true; done  # up to 6 tries, waits 2,4,8,16,32 s: a GitHub 500 needs more than a second
          exit 1
      - name: Chain the next run (sleep to the next half hour, then re-dispatch on main)
        if: "!cancelled() && steps.gate.outputs.go == 'true' && steps.fresh.outputs.poll == 'true'"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_START: ${{ steps.gate.outputs.start }}
        run: |
          END="$(date -u -d '2027-02-28T23:59:00Z' +%s)"
          NOW="$(date -u +%s)"
          START="${RUN_START:-$NOW}"
          EARLIEST=$(( START + 1560 ))   # 26 minutes after the start, so the successor is never under the 25 minute freshness line
          [ "$EARLIEST" -lt "$NOW" ] && EARLIEST="$NOW"
          TARGET=$(( (EARLIEST + 1799) / 1800 * 1800 ))
          if [ "$TARGET" -ge "$END" ]; then echo "next run would pass the end date: not chaining"; exit 0; fi
          echo "sleeping $(( TARGET - NOW )) s to the next half hour"
          sleep $(( TARGET - NOW ))
          if [ "$(date -u +%s)" -ge "$END" ]; then echo "past the end date: not chaining"; exit 0; fi
          gh workflow run record-politics.yml --ref main
