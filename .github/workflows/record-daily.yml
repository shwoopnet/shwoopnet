# Nov 3, 2026 (research only, RECDAILY): records the public quotes of the daily, weekly and monthly markets that the registered forward tests USWEEP1, BARRIER1, NOWCAST1 and FEDIMPL1 watch, every 30 minutes, and each market's result when it settles.
# Public data only: no key, no secret, no order. The built-in GITHUB_TOKEN pushes gzipped files to the `quote-data` branch under daily/, never to main. What is polled is listed in kalshi-scalper/workers/RECDAILY_WATCHLIST.json.
# Scheduled runs are often late or dropped, so each run writes a file named for its 30 minute slot (a re-run of a slot overwrites it) and every row carries its own timestamp; the reader takes the nearest poll to each look.
name: record-daily
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: record-daily
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Get the recorder script and watchlist from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          path: code
      - name: Open the data branch (created empty the first time)
        run: |
          mkdir data && cd data
          git init -q
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin quote-data; then git checkout -q -b quote-data FETCH_HEAD; else git checkout -q --orphan quote-data; fi
      - name: Poll the watchlist once
        run: python3 code/scripts/record_daily.py data --watchlist code/kalshi-scalper/workers/RECDAILY_WATCHLIST.json
      - name: Commit and push the data branch
        if: always()
        run: |
          cd data
          git config user.name "daily-recorder"
          git config user.email "daily-recorder@users.noreply.github.com"
          git add daily
          git commit -q -m "daily $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "nothing new"; exit 0; }
          for i in 1 2 3; do git push -q origin quote-data && exit 0; git pull -q --rebase origin quote-data || true; done
          exit 1
