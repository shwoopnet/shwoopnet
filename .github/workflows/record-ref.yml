# Nov 3, 2026 (research only, RECREF): every 2 hours records the Kalshi quotes of a watchlist of entertainment and tech series that settle on a public number, together with the current value of that number from its public source (kworb Spotify charts, Rotten Tomatoes, Metacritic, Apple App Store, Polymarket xtracker post counts), so a later test can ask whether the live reference already implied the outcome at the look.
# Public data only: no key, no secret, no order, GET only, one request per second per host. The built-in GITHUB_TOKEN pushes gzipped files to the `quote-data` branch under ref/, never to main. What is polled is listed in kalshi-scalper/workers/RECREF_WATCHLIST.json.
# Scheduled runs are often late or dropped, so each run writes files named for its 2 hour slot (a re-run of a slot overwrites them) and every row carries its own timestamp.
name: record-ref
on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: record-ref
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get the recorder script and watchlist from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          path: code
      - name: Open the data branch (created empty the first time)
        run: |
          mkdir data && cd data
          git init -q
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin quote-data; then git checkout -q -b quote-data FETCH_HEAD; else git checkout -q --orphan quote-data; fi
      - name: Poll the watchlist once (Kalshi quotes and the public reference values)
        run: python3 code/scripts/record_ref.py data --watchlist code/kalshi-scalper/workers/RECREF_WATCHLIST.json
      - name: Commit and push the data branch
        if: always()
        run: |
          cd data
          git config user.name "ref-recorder"
          git config user.email "ref-recorder@users.noreply.github.com"
          git add ref
          git commit -q -m "ref $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "nothing new"; exit 0; }
          for i in 1 2 3 4 5 6; do git push -q origin quote-data && exit 0; [ "$i" -lt 6 ] || break; sleep $((2 ** i)); git pull -q --rebase origin quote-data || true; done  # up to 6 tries, waits 2,4,8,16,32 s: a GitHub 500 needs more than a second
          exit 1
