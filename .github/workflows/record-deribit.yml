# Oct 31, 2026 (the owner approved the research session's DERIBIT-IMPLIED, registration in kalshi-scalper/workers/DERIBIT_IMPLIED_REGISTRATION.md): once a minute from 60 to 30 minutes before each hourly Bitcoin ladder close (KXBTCD), records Kalshi's ladder quotes and Deribit's option implied vols, so an options-implied probability can be scored forward.
# Public data only: no key, no secret, no order. The built-in GITHUB_TOKEN pushes gzipped files to the `quote-data` branch (under deribit/), never to main. The script has a built-in stop date (2026-12-31 UTC) after which it records nothing; delete this workflow to stop earlier. Same back to back 4 hour job pattern as record-book.
name: record-deribit
on:
  schedule:
    - cron: "50 3,7,11,15,19,23 * * *"
    - cron: "20 * * * *"   # Oct 31, 2026: same reason as record-quotes; an hourly trigger behind the 4 hour jobs, so a dropped start costs at most about an hour.
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: record-deribit
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Get the recorder script from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          path: code
      - name: Open the data branch (created empty the first time)
        run: |
          mkdir data && cd data
          git init -q
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin quote-data; then git checkout -q -b quote-data FETCH_HEAD; else git checkout -q --orphan quote-data; fi
      - name: Record until a minute past the next 4 hour boundary
        run: |
          STAMP="$(date -u +%Y-%m-%d/%H%M)"
          mkdir -p "data/deribit/$STAMP"
          python3 code/scripts/record_deribit.py "data/deribit/$STAMP" --cycle-hours 4
          gzip -9 -f data/deribit/$STAMP/*.csv
      - name: Commit and push the data branch
        if: always()
        run: |
          cd data
          git config user.name "deribit-recorder"
          git config user.email "deribit-recorder@users.noreply.github.com"
          git add deribit
          git commit -q -m "deribit $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "nothing new"; exit 0; }
          for i in 1 2 3 4 5 6; do git push -q origin quote-data && exit 0; [ "$i" -lt 6 ] || break; sleep $((2 ** i)); git pull -q --rebase origin quote-data || true; done  # up to 6 tries, waits 2,4,8,16,32 s: a GitHub 500 needs more than a second
          exit 1
