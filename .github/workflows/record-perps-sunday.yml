# Samples Kalshi's PUBLIC perpetual markets every 10 seconds around the Sunday reopening, 17:55 to 18:35 New York time (research only, Nov 6, 2026, V2's request, the owner approved).
# No secret is used or needed: plain GETs of a public endpoint; the built-in GITHUB_TOKEN only pushes gzipped CSV to the `perp-data` branch (under perps10/), never to main.
# Started every 10 minutes on Sunday afternoons and evenings UTC (covers both daylight saving offsets); the script itself records only inside the window and exits at once otherwise. Stops by itself after 2027-02-26.
name: record-perps-sunday
on:
  schedule:
    - cron: "5,15,25,35,45,55 21,22,23 * * 0"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: record-perps-sunday
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Get the recorder scripts from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          path: code
      - name: Open the data branch
        run: |
          mkdir data && cd data
          git init -q
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin perp-data; then git checkout -q -b perp-data FETCH_HEAD; else git checkout -q --orphan perp-data; fi
      - name: Record
        run: |
          [ "$(date -u +%Y%m%d)" -le 20270226 ] || { echo "past the stop date 2027-02-26; nothing recorded"; exit 0; }
          python3 code/scripts/record_perps_sunday.py data/perps10
      - name: Commit and push the data branch
        run: |
          cd data
          git config user.name "perp-recorder"
          git config user.email "perp-recorder@users.noreply.github.com"
          git add perps10 2>/dev/null || true
          git commit -q -m "perps 10s Sunday $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "nothing new"; exit 0; }
          for i in 1 2 3 4 5 6; do git push -q origin perp-data && exit 0; [ "$i" -lt 6 ] || break; sleep $((2 ** i)); git pull -q --rebase origin perp-data || true; done
          exit 1
