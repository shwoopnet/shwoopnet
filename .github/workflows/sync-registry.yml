# Nov 13, 2026 (the owner: "these are updated on our site?"). Keeps the wheel and closure rows of strategies-registry.json in step
# with the Head of R&D's files on the rnd-queue branch. It only OPENS OR UPDATES A PULL REQUEST from the bot branch registry-sync/auto;
# it never pushes to main and never merges. The owner merges each sync PR. Reads git only (no outside host), holds no secret but the built-in token.
name: sync-registry
on:
  schedule:
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: sync-registry
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch the research branch
        run: git fetch origin rnd-queue
      - name: Regenerate the registry
        run: python3 scripts/sync_registry.py --ref origin/rnd-queue
      - name: Stop when nothing changed
        id: diff
        run: |
          if git diff --quiet -- strategies-registry.json; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "registry already in step"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Refuse a file that fails the registry or live-figure gates
        if: steps.diff.outputs.changed == 'true'
        run: |
          node test/strategyRegistryGates.test.js
          node test/noLiveFiguresGates.test.js
          node test/registrySyncGates.test.js
      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B registry-sync/auto
          git add strategies-registry.json
          git commit -m "Registry sync: wheel places and closures from the research branch"
          git push --force-with-lease origin registry-sync/auto
          if [ -z "$(gh pr list --head registry-sync/auto --state open --json number --jq '.[0].number')" ]; then
            gh pr create --base main --head registry-sync/auto --title "Registry sync (automatic)" --body "Regenerated by scripts/sync_registry.py from WHEEL_ADMIT_LIST.md and RND_QUEUE.md on rnd-queue. Only WH- and CL- rows change. The owner merges; nothing here deploys."
          fi
