# RECBOOK2 (research only): the same recorder pattern as record-book.yml for the hourly Ethereum (KXETHD) and gold (KXGOLDH) ladders, 5 second cadence, into book2/ on the `quote-data` branch.
# Public data only: no key, no secret, no order. The built-in GITHUB_TOKEN pushes gzipped files to `quote-data`, never to main. The Bitcoin workflow (record-book.yml) is unchanged. To stop: delete this file.
name: record-book2
on:
  schedule:
    - cron: "50 3,7,11,15,19,23 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: record-book2
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Get the recorder script from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          path: code
      - name: Open the data branch (created empty the first time)
        run: |
          mkdir data && cd data
          git init -q
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin quote-data; then git checkout -q -b quote-data FETCH_HEAD; else git checkout -q --orphan quote-data; fi
      - name: Record until a minute past the next 4 hour boundary
        run: |
          STAMP="$(date -u +%Y-%m-%d/%H%M)"
          mkdir -p "data/book2/$STAMP"
          python3 code/scripts/record_book2.py "data/book2/$STAMP" --cycle-hours 4
          gzip -9 -f data/book2/$STAMP/*.csv
      - name: Commit and push the data branch
        if: always()
        run: |
          cd data
          git config user.name "book2-recorder"
          git config user.email "book2-recorder@users.noreply.github.com"
          git add book2
          git commit -q -m "book2 $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "nothing new"; exit 0; }
          for i in 1 2 3; do git push -q origin quote-data && exit 0; git pull -q --rebase origin quote-data || true; done
          exit 1
