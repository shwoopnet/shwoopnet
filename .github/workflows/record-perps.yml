# Records Kalshi's PUBLIC perpetual-market data once an hour into a data branch (research only, Oct 21, 2026).
# No secret is used or needed: the script makes one plain GET to a public endpoint, and the built-in GITHUB_TOKEN only pushes the CSV to the `perp-data` branch, never to main.
# Why: FUND1 (README, kalshi-scalper) needs Kalshi's own funding premium history, which the Perps API does not provide, so it has to be recorded from now on.
# Nov 12, 2026: GitHub dropped most hourly starts (commits at 02:49Z and 10:52Z with nothing between), so a start now comes at minutes 7 and 37. A freshness step skips the sample when the newest row on the data branch is under 45 minutes old,
# so a full set of starts still gives about one sample an hour (at most 24 a day) and a dropped start is covered by the next one 30 minutes later. One request per sample, no more than before.
name: record-perps
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: record-perps
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get the recorder script from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          path: code
      - name: Open the data branch (created empty the first time)
        run: |
          mkdir data && cd data
          git init -q
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin perp-data; then git checkout -q -b perp-data FETCH_HEAD; else git checkout -q --orphan perp-data; fi
      - name: Skip when the newest sample is under 45 minutes old (a start the schedule did not drop)
        id: fresh
        run: |
          F="data/perps/perps-$(date -u +%Y-%m-%d).csv"
          LAST="$( [ -f "$F" ] && tail -1 "$F" | cut -d, -f1 || true )"
          THEN="$( [ -n "$LAST" ] && date -u -d "$LAST" +%s 2>/dev/null || echo 0 )"
          if [ $(( $(date -u +%s) - THEN )) -lt 2700 ]; then echo "newest sample $LAST is under 45 minutes old: skipping"; echo "sample=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "sample=true" >> "$GITHUB_OUTPUT"
      - name: Record one sample
        if: steps.fresh.outputs.sample == 'true'
        run: python3 code/scripts/record_perps.py data/perps
      - name: Commit and push the data branch
        run: |
          cd data
          git config user.name "perp-recorder"
          git config user.email "perp-recorder@users.noreply.github.com"
          git add perps
          git commit -q -m "perps sample $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "nothing new"; exit 0; }
          git push -q origin perp-data
