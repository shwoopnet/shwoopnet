# Nov 16, 2026 (the Head's order; NOT merged until the owner's popup accepts its runner minutes, about 43,000 a month, far over the 250 guideline; free on a public repo).
# Research data only: what Kalshi's PUBLIC perps API shows only LIVE (candles, funding and the trade tape back-serve and are not recorded here): every 60 seconds the perps list (one request, all markets:
# bid, ask, sizes, last price, reference price, settlement and liquidation marks, open interest, 24 hour volume, leverage estimate) and the order books of the active markets (depth 5, one request of at most 100 tickers).
# Public GET only: no secret, no key, no order, no Firestore. The built-in GITHUB_TOKEN pushes gzipped files to the `perp-live-data` branch (under perplive/), never to main; the first run creates it as an orphan branch.
# Scheduled starts run late or are dropped, so it is triggered every 15 minutes (two cron pairs) under one concurrency group that never cancels a running job: a run that finds a job running waits, so jobs
# never overlap, and a dropped trigger costs at most 15 minutes. Each job records up to the next 4 hour boundary (about 4 hours) and stops.
# It stops by itself: from 2027-02-26 23:59 UTC every run exits at once (checked in the first step and again in the script). Stop it sooner by deleting this file.
name: record-perps-live
on:
  schedule:
    - cron: "9,39 * * * *"
    - cron: "24,54 * * * *"   # a second pair 15 minutes after the first: GitHub sometimes drops scheduled starts for hours. Extra triggers queue behind a running job (one pending at most) and never overlap it.
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: record-perps-live
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Stop for good after the end date (2027-02-26 23:59 UTC)
        id: gate
        run: |
          if [ "$(date -u +%s)" -ge "$(date -u -d '2027-02-26T23:59:00Z' +%s)" ]; then echo "past the end date: nothing to record"; echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - name: Get the recorder script from main
        if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          path: code
      - name: Open the data branch (created empty the first time)
        if: steps.gate.outputs.go == 'true'
        run: |
          mkdir data && cd data
          git init -q
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin perp-live-data; then git checkout -q -b perp-live-data FETCH_HEAD; else git checkout -q --orphan perp-live-data; fi
      - name: Record every minute up to the next 4 hour boundary
        if: steps.gate.outputs.go == 'true'
        run: |
          STAMP="$(date -u +%Y-%m-%d/%H%M)"
          mkdir -p "data/perplive/$STAMP"
          python3 code/scripts/record_perps_live.py "data/perplive/$STAMP" --cycle-hours 4
          gzip -9 -f data/perplive/$STAMP/*.csv
      - name: Commit and push the data branch
        if: always() && steps.gate.outputs.go == 'true'
        run: |
          cd data
          git config user.name "perps-live-recorder"
          git config user.email "perps-live-recorder@users.noreply.github.com"
          gzip -9 -f perplive/*/*/*.csv 2>/dev/null || true
          git add perplive
          git commit -q -m "perplive $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "nothing new"; exit 0; }
          for i in 1 2 3 4 5 6; do git push -q origin perp-live-data && exit 0; [ "$i" -lt 6 ] || break; sleep $((2 ** i)); git pull -q --rebase origin perp-live-data || true; done  # up to 6 tries, waits 2,4,8,16,32 s: a GitHub 500 needs more than a second
          exit 1
