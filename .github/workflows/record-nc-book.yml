# Nov 11, 2026 (the owner approved, popup: "QUOTE READ on the bot's non-crypto markets"). R6's twin for the bot's NON-crypto 15 minute series (KXSILVER15M, KXCOPPER15M, KXWTI15M, KXEURUSD15M,
# KXGBPUSD15M, KXUSDJPY15M, KXHYPE15M, KXBNB15M, KXAUDUSD15M, KXUSDCAD15M, KXNATGAS15M): the best 5 YES and 5 NO bids with sizes every 2 seconds in one batched public read, every public trade
# of each window after its close (de-duplicated, ids not stored), a coverage row per window and an hourly clock check. Research data only: no order, no key, no Firestore.
# Public data only: no secret. The built-in GITHUB_TOKEN pushes gzipped files to the `quote-data` branch (under nc15/), never to main.
# Scheduled starts run late or are dropped, so it is triggered every 30 minutes under one concurrency group that never cancels a running job: a run that finds a job running waits, so jobs
# never overlap, and a dropped trigger costs at most 30 minutes. Each job records up to the next 4 hour boundary (about 4 hours) and stops.
# It is a continuous recorder like R6 (about 43,000 runner minutes a month, free on a public repo; the owner's merge accepts that, see CLAUDE.md).
# It stops by itself: from 2026-12-31 23:59 UTC every run exits at once (checked in the first step and again in the script). Stop it sooner by deleting this file.
name: record-nc-book
on:
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: record-nc-book
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Stop for good after the end date (2026-12-31 23:59 UTC)
        id: gate
        run: |
          if [ "$(date -u +%s)" -ge "$(date -u -d '2026-12-31T23:59:00Z' +%s)" ]; then echo "past the end date: nothing to record"; echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - name: Get the recorder script from main
        if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          path: code
      - name: Open the data branch (created empty the first time)
        if: steps.gate.outputs.go == 'true'
        run: |
          mkdir data && cd data
          git init -q
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin quote-data; then git checkout -q -b quote-data FETCH_HEAD; else git checkout -q --orphan quote-data; fi
      - name: Record every window up to the next 4 hour boundary
        if: steps.gate.outputs.go == 'true'
        run: |
          STAMP="$(date -u +%Y-%m-%d/%H%M)"
          mkdir -p "data/nc15/$STAMP"
          python3 code/scripts/record_nc_book.py "data/nc15/$STAMP" --cycle-hours 4
          gzip -9 -f data/nc15/$STAMP/*.csv
      - name: Commit and push the data branch
        if: always() && steps.gate.outputs.go == 'true'
        run: |
          cd data
          git config user.name "nc15-recorder"
          git config user.email "nc15-recorder@users.noreply.github.com"
          gzip -9 -f nc15/*/*/*.csv 2>/dev/null || true
          git add nc15
          git commit -q -m "nc15 $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "nothing new"; exit 0; }
          for i in 1 2 3 4 5 6; do git push -q origin quote-data && exit 0; [ "$i" -lt 6 ] || break; sleep $((2 ** i)); git pull -q --rebase origin quote-data || true; done  # up to 6 tries, waits 2,4,8,16,32 s: a GitHub 500 needs more than a second
          exit 1
